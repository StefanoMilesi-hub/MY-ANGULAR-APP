<div class="stat-card" [ngClass]="color">

  <!-- ✅ header -->
  <div class="header">
    <span class="icon">{{ icon }}</span>

    <span class="change" [class]="change > 0 ? 'positive' : 'negative'">
      {{ change > 0 ? '📈' : '📉' }} {{ change }}%
    </span>
  </div>

  <!-- ✅ body -->
  <div class="body">
    <p class="title">{{ title }}</p>
    <p class="value">{{ value }}</p>
  </div>

  <!-- ✅ delete SEMPRE visibile -->
  <button class="delete-btn" (click)="deleteStat.emit(id)">
    🗑️
  </button>

</div>
