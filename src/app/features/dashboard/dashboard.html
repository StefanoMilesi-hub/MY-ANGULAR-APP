<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Dashboard</h1>
    <p>Benvenuto nel tuo cruscotto di amministrazione</p>
  </div>

  <div class="form-card">
    <form [formGroup]="homeform" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <div class="icon-input">
          <span
            *ngFor="let ic of icons"
            class="icon-item"
            [class.selected]="homeform.get('icon')?.value === ic"
            (click)="selectIcon(ic)"
          >
            {{ ic }}
          </span>
        <input
          style="width: 30px"
          formControlName="icon" 
          placeholder="icon"/>
        </div>
      </div>

      <div class="form-field">
        <div class="stat-header">
          <span class="stat-change" [class]="changeClass">
             📈 / 📉  
            <input id="stat-change" formControlName="change" placeholder="Variazione %" type="number" min="-100" max="100" step="1.1-2"/>
            %
          </span>
          
        </div>
      </div>

      <div class="form-field">
        <h3 class="stat-title">
          <input id="stat-title" formControlName="title" placeholder="Titolo card" />
        </h3>

        <p class="stat-value">
          <input id="stat-value" formControlName="value" placeholder="Valore card" type="number" min="0" max="10000000" step="1"/>
        </p>
      </div>  

    <div class="form-actions">
      <button type="submit" class="btn-primary" [disabled]="!homeform.valid">Invia</button>
    </div>
    </form>
  </div>

  <div class="stats-grid">
    @for (stat of dashboardStats(); track stat.id) {
      <app-stat-card
        [id]="stat.id"
        [title]="stat.title"
        [value]="stat.value"
        [change]="stat.change"
        [icon]="stat.icon"
        [color]="stat.color"
        (deleteStat)="onDeleteStat($event)"
      />
    }
  </div>

  <div class="dashboard-content">
    <div class="main-section">
      <app-items-list
        [items]="dashboardItems()"
        (itemAdded)="onItemAdded($event)"
        (deleteItem)="onDeleteItem($event)"
      ></app-items-list>
    </div>

    <div class="sidebar-section">
      <div class="quick-actions">
        <h3>Azioni Rapide</h3>
        <ul>
          <li>
            <button class="action-btn" mat-button (click)="openDialog()">+ Nuovo Progetto</button>
          </li>
           <li>
            <button class="action-btn" mat-button (click)="openDialogReport()">📊 Esporta Report</button>
          </li>
          <li>
            <button class="action-btn" mat-button (click)="openDialogSettings()">⚙️ Settings</button>
          </li>
          <li><button class="action-btn">👥 Gestisci Utenti</button></li>
        </ul>
      </div>

      <div class="activity-feed">
        <h3>Attività Recente</h3>
        <div class="activity-item">
          <span class="activity-icon">✅</span>
          <div class="activity-text">
            <p>Progetto completato</p>
            <small>2 ore fa</small>
          </div>
        </div>
        <div class="activity-item">
          <span class="activity-icon">👤</span>
          <div class="activity-text">
            <p>Nuovo utente iscritto</p>
            <small>5 ore fa</small>
          </div>
        </div>
        <div class="activity-item">
          <span class="activity-icon">📈</span>
          <div class="activity-text">
            <p>Aumento conversioni</p>
            <small>1 giorno fa</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
