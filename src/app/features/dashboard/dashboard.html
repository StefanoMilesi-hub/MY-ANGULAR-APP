<div class="dashboard-container">

    <!-- HEADER -->
    <div class="dashboard-header">
      <h1>Dashboard</h1>
      <p>Benvenuto nel tuo cruscotto di amministrazione</p>
    </div>

    <!-- FORM -->
    <div class="form-card">
    <form [formGroup]="homeform" (ngSubmit)="onSubmit()">

    <div class="top-row">

      <!-- ✅ BLOCCO SINISTRO -->
      <div class="left-block">

        <!-- ICON + INPUT -->
        <div class="icon-row">
          <div class="icon-picker">
            <span
              *ngFor="let ic of icons"
              class="icon-item"
              [class.selected]="homeform.get('icon')?.value === ic"
              (click)="selectIcon(ic)"
            >
              {{ ic }}
            </span>
          </div>

          <input
            class="icon-input"
            formControlName="icon"
            placeholder="Icona"
          />
        </div>

        <!-- ✅ TITOLO SUBITO SOTTO -->
        <input
          class="title-input"
          formControlName="title"
          placeholder="Titolo card"
        />

      </div>

      <!-- ✅ CHANGE A DESTRA -->
      <div class="change-box" [class]="changeClass">
        <span>{{ changeIcon }}</span>
        <input type="number" formControlName="change" />
        %
    </div>
  </div>

    <!-- ✅ VALORE (sinistra) -->
    <div class="value-row">
      <input
        type="number"
        formControlName="value"
        placeholder="Valore"
      />
    </div>

    <!-- ✅ BUTTON (basso destra) -->
    <div class="actions">
      <button class="submit-btn" [disabled]="homeform.invalid">
        ➕ Aggiungi
      </button>
    </div>

  </form>
</div>

  <!-- STATS -->
  <div class="stats-grid">
    <app-stat-card
      *ngFor="let stat of dashboardStats(); trackBy: trackById"
      [id]="stat.id!"
      [title]="stat.title"
      [value]="stat.value"
      [change]="stat.change"
      [icon]="stat.icon"
      [color]="stat.color"
      (deleteStat)="onDeleteStat($event)"
    ></app-stat-card>
  </div>

  <!-- CONTENT -->
  <div class="dashboard-content">

  <!-- ✅ COLONNA SINISTRA -->
    <div class="main-section">

    <!-- ✅ FORM ALLINEATA ALLA LISTA -->
    <div class="items-form-card">
      <form [formGroup]="itemForm" (ngSubmit)="onSubmitItem()">

        <div class="item-form">

          <div class="row">
            <input formControlName="name" placeholder="Nome progetto" />
          </div>

          <div class="row">
            <select formControlName="status" class="status-select">
              <option value="active">Attivo</option>
              <option value="inactive">Inattivo</option>
              <option value="disabled">Disattivo</option>
            </select>
          </div>

          <div class="row">
            <input type="date" formControlName="date" />
          </div>

          <div class="row">
            <input type="number" formControlName="value" placeholder="Valore" />
          </div>

          <div class="actions">
            <button type="submit">
              ➕ Aggiungi
            </button>
          </div>

        </div>

      </form>
    </div>

    <!-- ✅ LISTA ITEMS -->
    <app-items-list
      [items]="dashboardItems()"
      (deleteItem)="onDeleteItem($event)">
    </app-items-list>

   </div>

    <div class="sidebar-section">

      <!-- ACTIONS -->
      <div class="quick-actions">
        <h3>Azioni Rapide</h3>

        <button class="action-btn" (click)="openDialog()">
          ➕ Nuovo Progetto
        </button>

        <button class="action-btn" (click)="openDialogReport()">
          📊 Esporta Report
        </button>

        <button class="action-btn" (click)="openDialogSettings()">
          ⚙️ Settings
        </button>

      </div>

      <!-- ACTIVITY -->
      <div class="activity-feed">
        <h3>Attività Recente</h3>

        <div class="activity-item">
          ✅ Progetto completato
          <small>2 ore fa</small>
        </div>

        <div class="activity-item">
          👤 Nuovo utente
          <small>5 ore fa</small>
        </div>

      </div>

    </div>
  </div>
</div>
