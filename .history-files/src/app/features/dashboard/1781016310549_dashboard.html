<div class="dashboard-container">

  <!-- HEADER -->
  <div class="dashboard-header">
    <h1>Dashboard</h1>
    <p>Benvenuto nel tuo cruscotto di amministrazione</p>
  </div>

  <!-- FORM -->
  <div class="form-card">
    <form [formGroup]="homeform" (ngSubmit)="onSubmit()">

      <!-- ICON -->
      <div class="form-field">
        <label>Icona</label>

        <div class="icon-input">
          <span
            *ngFor="let ic of icons"
            class="icon-item"
            [class.selected]="homeform.get('icon')?.value === ic"
            (click)="selectIcon(ic)"
          >
            {{ ic }}
          </span>

          <input formControlName="icon" placeholder="Icona"/>
        </div>
      </div>

      <!-- CHANGE -->
      <div class="form-field">
        <label>Variazione %</label>

        <div class="change-box" [class]="changeClass">
          <span>{{ changeIcon }}</span>

          <input
            formControlName="change"
            type="number"
            min="-100"
            max="100"
            step="0.1"
          />

          %
        </div>
      </div>

      <!-- TITLE -->
      <div class="form-field">
        <input formControlName="title" placeholder="Titolo card"/>
      </div>

      <!-- VALUE -->
      <div class="form-field">
        <input
          formControlName="value"
          type="number"
          min="0"
          placeholder="Valore"
        />
      </div>

      <!-- SUBMIT -->
      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="homeform.invalid">
          Invia
        </button>
      </div>

    </form>
  </div>

  <!-- STATS -->
<div class="stats-grid">
  <app-stat-card
    *ngFor="let stat of dashboardStats(); trackBy: trackById"
    [id]="stat.id!"
    [title]="stat.title"
    [value]="stat.value | number"
    [change]="stat.change"
    [icon]="stat.icon"
    [color]="stat.color"
    (deleteStat)="onDeleteStat($event)"
  ></app-stat-card>
</div>


  <!-- CONTENT -->
  <div class="dashboard-content">

    <div class="main-section">
      <app-items-list
        [items]="dashboardItems()"
        (deleteItem)="onDeleteItem($event)">
      </app-items-list>
    </div>

    <div class="sidebar-section">

      <!-- ACTIONS -->
      <div class="quick-actions">
        <h3>Azioni Rapide</h3>

        <button class="action-btn" (click)="openDialog()">
          ➕ Nuovo Progetto
        </button>

        <button class="action-btn" (click)="openDialogReport()">
          📊 Esporta Report
        </button>

        <button class="action-btn" (click)="openDialogSettings()">
          ⚙️ Settings
        </button>

      </div>

      <!-- ACTIVITY -->
      <div class="activity-feed">
        <h3>Attività Recente</h3>

        <div class="activity-item">
          ✅ Progetto completato
          <small>2 ore fa</small>
        </div>

        <div class="activity-item">
          👤 Nuovo utente
          <small>5 ore fa</small>
        </div>

      </div>

    </div>
  </div>
</div>
